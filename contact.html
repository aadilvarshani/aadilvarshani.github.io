<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Contact | Aadil Varshani</title>
<meta name="description" content="Get in touch with Aadil Varshani, threat detection engineer in Pune.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script src="js/theme-init.js"></script>
</head>
<body class="page-contact">

<header class="site-bar">
  <a class="site-bar__name" href="index.html">Aadil Varshani</a>
  <nav class="site-bar__nav" aria-label="Main">
    <a href="blog/index.html">Writing</a>
    <a href="contact.html">Contact</a>
    <a href="https://github.com/aadilvarshani" target="_blank" rel="noopener noreferrer">GitHub</a>
    <button class="theme-toggle" type="button" data-theme-toggle hidden>Dark</button>
  </nav>
</header>

<main>

  <section class="statement">
    <h1 class="statement__title">Get in touch.</h1>
    <p class="statement__lede">Happy to talk detection engineering, the build log, or roles. Based in Pune, working remotely.</p>
  </section>

  <section class="section" aria-labelledby="contact-form-title">
    <h2 class="visually-hidden" id="contact-form-title">Contact form</h2>
    <form class="contact-form" id="contact-form" action="https://formspree.io/f/mzdnerbv" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" maxlength="100" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" maxlength="254" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" maxlength="5000" required></textarea>

      <input type="text" name="_gotcha" class="contact-form__hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" class="contact-form__submit">Send message</button>
      <p class="contact-form__note" id="contact-form-note" role="status"></p>
    </form>
  </section>

</main>

<footer class="site-foot">
  <p>Hindi, English, Marathi, and a little Spanish. Based in Pune.</p>
</footer>

<script src="js/theme-toggle.js" defer></script>
<script src="js/contact-form.js" defer></script>
</body>
</html>
